# Deploys the theme folder to the WordPress host over SSH (Hostinger staging now, Bluehost at launch).
#   push to main          -> staging
#   Actions > Deploy > Run workflow (target: production) -> live site
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST           server IP or hostname (Hostinger: hPanel > Advanced > SSH Access)
#   DEPLOY_PORT           SSH port (Hostinger uses 65002; Bluehost uses 22)
#   DEPLOY_USER           SSH username
#   DEPLOY_SSH_KEY        private key; add the matching public key on the host's SSH Access page
#   DEPLOY_STAGING_PATH   e.g. /home/USER/domains/SITE/public_html/wp-content/themes/solevo
#   DEPLOY_LIVE_PATH      the same folder on the live site (set at launch)
name: Deploy theme

on:
  push:
    branches: [main]
    paths: ['theme/solevo/**']
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to deploy'
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy settings
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "Deploy settings not added yet (Settings > Secrets and variables > Actions). Skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint PHP
        run: find theme/solevo -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Set up SSH
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync theme
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEST: ${{ (github.event.inputs.target == 'production') && secrets.DEPLOY_LIVE_PATH || secrets.DEPLOY_STAGING_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          rsync -az --delete --exclude '.DS_Store' \
            -e "ssh -p ${PORT} -i ~/.ssh/id_deploy" \
            theme/solevo/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEST}/"
